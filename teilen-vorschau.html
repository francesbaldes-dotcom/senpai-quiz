<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Teilen-Vorschau</title>
<link rel="stylesheet" href="css/fonts.css">
<style>body{margin:0;background:#888;display:flex;gap:20px;padding:20px;flex-wrap:wrap} img{width:540px;height:675px;border:1px solid #000}</style>
</head><body>
<script type="module">
import { tagesquizBild, bossBild } from './js/teilen-bild.js';
const link = 'francesbaldes-dotcom.github.io/senpai-quiz';
const bilder = [
  bossBild({ boss: 'Der Cliffhanger', bild: 'assets/reise/boss-01.webp', kapitelNr: 1, kapitelTitel: 'Das Dorf', sterne: 12, sterneMax: 150, heimkehr: false, link }),
  bossBild({ boss: 'Der Spoiler', bild: 'assets/reise/boss-10.webp', kapitelNr: 10, kapitelTitel: 'Der Spoiler', sterne: 141, sterneMax: 150, heimkehr: true, link }),
  tagesquizBild({ datum: '09.10.2026', verlauf: [true, true, false, true, true], richtig: 4, gesamt: 5, streak: 7, link }),
];
for (const p of bilder) {
  const datei = await p;
  const img = document.createElement('img');
  img.src = URL.createObjectURL(datei);
  document.body.appendChild(img);
}
</script></body></html>
